[project]
name = "typer-template-maintenance"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "copier==9.17.2",
    "hatchling>=1.27,<2",
    "mypy>=2.3,<3",
    "pybind11>=3,<4",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.4",
    "scikit-build-core>=0.11,<1",
    "typer==0.27.3",
    "pydantic>=2.12,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["tools"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests", "tools/test_composition.py"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["tools"]
omit = ["*/tools/test_composition.py"]

[tool.coverage.report]
fail_under = 0
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"
