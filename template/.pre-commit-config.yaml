repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
