name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./template/.github/actions/actionlint
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore the locked Docker toolchain and dependency graph
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: typertemplate:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-quality-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Fresh maintenance lint, types and Copier regressions
        run: make check
      - name: Advisory coverage summary
        if: always()
        run: test ! -f coverage/summary.md || cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Source, report and package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            coverage/
            dist/
          if-no-files-found: error
          retention-days: 14
  template:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: cli, variant: cli, persistence: false}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Reuse the verified maintenance dependency cache on this worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: typertemplate:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Real isolated Copier render using the canonical Docker toolchain
        run: make render RENDER_OUTPUT="$RUNNER_TEMP/rendered" RENDER_ARGS='-d projectName=example${{ matrix.variant }} -d profile=${{ matrix.profile }} -d withPersistence=${{ matrix.persistence }}'
      - name: Resolve the first lock in Docker
        run: docker run --rm --env UV_CACHE_DIR=/tmp/uv --user "$(id -u):$(id -g)" --mount "type=bind,source=$RUNNER_TEMP/rendered,target=/render" --workdir /render typertemplate:quality uv lock
      - name: Cached generated-project dependency graph
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ runner.temp }}/rendered
          file: ${{ runner.temp }}/rendered/Dockerfile.quality
          target: quality
          load: true
          tags: rendered:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-render-${{ matrix.variant }}-quality-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-render-${{ matrix.variant }}-quality-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Source suite, wheel/sdist and fresh installed-package suite
        working-directory: ${{ runner.temp }}/rendered
        run: make check build verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rendered-${{ matrix.variant }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rendered/coverage/
            ${{ runner.temp }}/rendered/dist/
          if-no-files-found: error
          retention-days: 14
  required:
    if: always()
    needs: [source, template]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env: {SOURCE: '${{ needs.source.result }}', TEMPLATE: '${{ needs.template.result }}'}
        run: test "$SOURCE" = success && test "$TEMPLATE" = success
